const TIE_BREAKER_ORDER = [
  "digital_organism",
  "red_thread_self_assembly",
  "tall_grass_forgotten_information",
  "screen_mask",
  "clown_mask_failed_celebration",
  "white_rabbit_digital_eye",
  "psyche_chair"
];

let currentIdx = 0;
let userAnswers = [];

function showQuestion() {
  const q = QUESTIONS[currentIdx];
  const block = document.getElementById('questionBlock');
  block.classList.remove('visible');

  setTimeout(() => {
    document.getElementById('questionNumber').innerText = `ВОПРОС ${String(currentIdx + 1).padStart(2, '0')}`;
    document.getElementById('questionText').innerText = q.text;

    const area = document.getElementById('optionsArea');
    area.innerHTML = '';
    q.options.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.type = 'button';
      btn.innerHTML = `<span class="opt-letter">${opt.letter}</span>${opt.text}`;
      btn.onclick = () => selectOption(index);
      area.appendChild(btn);
    });

    document.getElementById('btnNext').classList.remove('active');
    document.getElementById('progressFill').style.width = `${((currentIdx + 1) / QUESTIONS.length) * 100}%`;
    document.getElementById('progressLabel').innerText = `${currentIdx + 1} / ${QUESTIONS.length}`;
    block.classList.add('visible');
  }, 220);
}

function selectOption(idx) {
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.classList.remove('selected'));
  btns[idx].classList.add('selected');
  userAnswers[currentIdx] = QUESTIONS[currentIdx].options[idx].scores;
  document.getElementById('btnNext').classList.add('active');
}

function nextQuestion() {
  if (!userAnswers[currentIdx]) return;
  if (currentIdx < QUESTIONS.length - 1) {
    currentIdx++;
    showQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('header').style.marginBottom = '22px';

  const scores = {};
  Object.keys(RESULTS_DATA).forEach(id => scores[id] = 0);

  userAnswers.forEach(scoreMap => {
    Object.keys(scoreMap).forEach(id => {
      scores[id] = (scores[id] || 0) + scoreMap[id];
    });
  });

  const maxVal = Math.max(...Object.values(scores));
  const candidates = Object.keys(scores).filter(id => scores[id] === maxVal);
  const finalId = TIE_BREAKER_ORDER.find(id => candidates.includes(id)) || candidates[0];
  const res = RESULTS_DATA[finalId];

  document.getElementById('resultImg').src = res.image;
  document.getElementById('resultImg').alt = res.title;
  document.getElementById('resultTitle').innerText = res.title;
  document.getElementById('resultDesc').innerText = res.desc;
  document.getElementById('resultContext').innerText = res.context;
  document.getElementById('resultPhrase').innerText = res.phrase;

  if (typeof ym !== 'undefined') {
    ym(102243622, 'reachGoal', 'quiz_finish_titova_v1', { result: finalId });
  }

  document.getElementById('resultBlock').classList.add('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  currentIdx = 0;
  userAnswers = [];
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'flex';
  document.getElementById('resultBlock').classList.remove('visible');
  document.getElementById('header').style.marginBottom = '';
  showQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = () => {
  document.getElementById('progressWrap').style.display = 'flex';
  showQuestion();
};
</script>
